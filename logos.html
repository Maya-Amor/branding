<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, email=no">
  <title>Logos | Maya Amor</title>
  <meta name="description" content="A selection of logos Maya Amor designed for brands over the years: Invite Us, Roomme, Updated, Noss, Calypso and Guy Shamir.">

  <!-- Link preview (LinkedIn, WhatsApp, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Maya Amor">
  <meta property="og:title" content="Logos | Maya Amor">
  <meta property="og:description" content="A selection of logos Maya Amor designed for brands over the years: Invite Us, Roomme, Updated, Noss, Calypso and Guy Shamir.">
  <meta property="og:url" content="https://maya-amor.github.io/branding/logos.html">
  <meta property="og:image" content="https://maya-amor.github.io/branding/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://maya-amor.github.io/branding/logos.html">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Lets CSS know JavaScript is on, so scroll animations only hide content when they can reveal it -->
  <script>document.documentElement.classList.add("js");</script>
</head>
<body class="page-case page-case--brand" style="--project:#000; --project-accent:#000; --project-border:#d9d9d9">

  <!-- ===== Sticky header (already docked on this page) ===== -->
  <header class="site-header">

    <a class="site-header__logo" href="index.html" aria-label="Maya Amor, home">
      <img src="assets/icons/logo.svg" alt="" width="46" height="56">
    </a>

    <button class="site-header__menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>

    <div class="site-header__nav" id="site-nav">
      <nav class="pill-nav" aria-label="Main">
        <a class="pill-nav__link" href="index.html#projects" aria-current="page">My projects</a>
        <a class="pill-nav__link" href="about.html">About</a>
        <a class="pill-nav__link" href="#contact">Let’s Talk</a>
        <a class="pill-nav__link" href="assets/Maya%20Amor%20Resume.pdf" target="_blank" rel="noopener">Resume</a>
      </nav>
    </div>
  </header>

  <!-- The logo bands run edge to edge, so only the intro sits in a container -->
  <main>
    <div class="cs container">
      <div class="cs-hero">
        <nav class="cs-breadcrumb" aria-label="Breadcrumb">
          <a href="index.html#projects">
            <img src="assets/icons/breadcrumb-arrow.svg" alt="" width="23" height="8">
            Case studies
          </a>
          <span aria-hidden="true">/</span>
          <span aria-current="page"><strong>Logos</strong></span>
        </nav>

        <h1 class="cs-title cs-title--brand">Logos</h1>
        <p class="cs-lead">Logos for brands</p>
      </div>
    </div>

    <!-- ===== One full-width band per logo =====
         --bg: the band color, --w: the logo's width on desktop (Figma width ÷ 1200) -->
    <ul class="logo-bands" aria-label="Logos">
      <li class="logo-band reveal" style="--bg:#fff; --w:47%">
        <img src="assets/Logos/Invite%20us.png" alt="Invite Us logo: a flowing handwritten “I” joined to “nvite us”" width="1128" height="551">
      </li>
      <li class="logo-band reveal" style="--bg:#e8e8e8; --w:37.2%">
        <img src="assets/Logos/Roomme.svg" alt="Roomme logo in red, its two o’s topped with gray rings, with the tagline “Find your RoomMte or Room in New York City”" width="446" height="132">
      </li>
      <li class="logo-band reveal" style="--bg:#323232; --w:40.1%">
        <img src="assets/Logos/updated.png" alt="Updated logo in orange, with “Thrifted Clothes” in purple underneath" width="962" height="278">
      </li>
      <li class="logo-band reveal" style="--bg:#f2ebe3; --w:31.7%">
        <img src="assets/Logos/noss.png" alt="Noss logo in thin black letters, with a small raised “o”" width="762" height="298">
      </li>
      <li class="logo-band reveal" style="--bg:#fff; --w:34.1%">
        <img src="assets/Logos/calypso.png" alt="Calypso logo, its “Ca” drawn as an @, with “fish restaurant” in Hebrew under a blue and orange line" width="820" height="294">
      </li>
      <li class="logo-band reveal" style="--bg:#323232; --w:39.1%">
        <img src="assets/Logos/Guy%20shamir.png" alt="Guy Shamir logo: the name in white Hebrew letters with orange accents" width="939" height="330">
      </li>
    </ul>
  </main>

  <!-- ===== Footer ===== -->
  <footer id="contact" class="footer">
    <!-- Closing line: the top of the footer -->
    <div class="footer__cta container reveal">
      <h2 class="footer__title">Got something worth<br>complaining about?</h2>
      <p class="footer__subtitle">I'm open to brand design roles and collaborations.</p>
    </div>

    <div class="footer__inner container">
      <p class="footer__copy">Maya Amor | All Rights Reserved ©</p>

      <div class="footer__contact">
        <span>Maya4085@gmail.com</span>
        <span>052-2256403</span>
      </div>

      <div class="footer__actions">
        <nav class="pill-nav pill-nav--footer" aria-label="External links">
          <a class="pill-nav__link" href="assets/Maya%20Amor%20Resume.pdf" target="_blank" rel="noopener">Resume</a>
        </nav>
      </div>
    </div>
  </footer>

  <!-- Floating back-to-top button, appears once you start scrolling -->
  <a class="back-to-top" href="#top" aria-label="Back to top">
    <img src="assets/icons/back-to-top.svg" alt="" width="47" height="47">
  </a>

  <script src="js/main.js"></script>
</body>
</html>
